[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-claw"
version = "0.6.0"
description = "Render narrated slide videos from HTML + a slide list. ElevenLabs TTS + optional fal.ai lipsync."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Amir Fish" }]
license = { text = "MIT" }
keywords = ["video", "tts", "elevenlabs", "fal", "narration", "slides", "lipsync"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "Pillow>=10.0",
]

[project.scripts]
video-claw = "video_claw.cli:main"

[project.urls]
Homepage = "https://github.com/amirfish1/video-claw"
Issues = "https://github.com/amirfish1/video-claw/issues"

[tool.setuptools.packages.find]
include = ["video_claw*"]

[tool.setuptools.package-data]
video_claw = [
  "templates/*.html",
  "templates/*.css",
  "assets/*.png",
  "skill_data/**/*.md",
]
