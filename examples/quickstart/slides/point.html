<!doctype html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="_shared.css">
<style>
  .cols {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 28px;
    margin-top: 30px;
  }
  .col {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 26px 28px;
  }
  .col .num {
    font-size: 56px; font-weight: 800; color: var(--accent); line-height: 1;
    letter-spacing: -0.02em;
  }
  .col h3 { font-size: 22px; margin: 12px 0 6px; font-weight: 700; }
  .col p { font-size: 17px; color: var(--muted); line-height: 1.45; margin: 0; }
  body.canvas.v .cols { grid-template-columns: 1fr; }
</style>
</head>
<body class="canvas h">
  <div class="eyebrow">The recipe</div>
  <h1>One idea per slide.</h1>
  <div class="cols">
    <div class="col">
      <div class="num">1</div>
      <h3>Slide anchors</h3>
      <p>Headline plus one supporting element. No paragraphs.</p>
    </div>
    <div class="col">
      <div class="num">2</div>
      <h3>Narration carries</h3>
      <p>The TTS line is where the meaning lives.</p>
    </div>
    <div class="col">
      <div class="num">3</div>
      <h3>Captions align</h3>
      <p>Word-level timestamps from ElevenLabs, burned in via libass.</p>
    </div>
  </div>
</body></html>
