<!doctype html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="_shared.css">
<style>
  .end { display: flex; flex-direction: column; justify-content: center; height: 100%; gap: 28px; }
  .cta {
    background: var(--panel); border: 1px solid var(--accent);
    border-radius: 12px; padding: 28px 32px; max-width: 1100px;
  }
  .cta .label {
    font-size: 14px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 10px;
  }
  .cta .url {
    font-family: "SF Mono", "Menlo", monospace;
    font-size: 26px; color: var(--text);
  }
  body.canvas.v .cta { max-width: 100%; }
  body.canvas.v .cta .url { font-size: 30px; }
</style>
</head>
<body class="canvas h">
  <div class="end">
    <div class="eyebrow">The takeaway</div>
    <h1>One last line that lands the point.</h1>
    <div class="cta">
      <div class="label">Link / next action</div>
      <div class="url">github.com/yourname/yourthing</div>
    </div>
  </div>
</body></html>
